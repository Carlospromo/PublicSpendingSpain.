[project]
name = "gasto-estado"
version = "0.1.0"
description = "Monitorización y auditoría del gasto del Estado español a nivel de dirección general / servicio presupuestario"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
    "lxml==6.1.1",
    "pandera==0.31.1",
    "duckdb==1.5.3",
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "typer==0.26.7",
    # pyyaml: necesaria para cargar config/sources.yaml (catálogo de fuentes)
    "pyyaml==6.0.3",
    # xlrd: única vía para leer los Anexo I históricos en .xls (BIFF/OLE2,
    # 2015-abril 2016); openpyxl solo lee OOXML. xlrd 2.x solo soporta .xls.
    "xlrd==2.0.2",
    "dagster==1.11.16",
]

[project.scripts]
gasto-estado = "gasto_estado.cli:app"

[dependency-groups]
dashboard = [
    # streamlit: prototipo de dashboard que consume la API v1 (Fase 8)
    "streamlit>=1.45.0",
    # plotly: gráficos interactivos (ritmo intra-anual, HHI, cruces)
    "plotly>=6.0.0",
]
dev = [
    "ruff==0.15.16",
    "mypy==2.3.0",
    "pytest==9.0.3",
    # types-pyyaml: stubs de tipado para que mypy --strict acepte pyyaml
    "types-pyyaml==6.0.12.20260518",
    # pandas-stubs / types-openpyxl: stubs de tipado para mypy --strict
    "pandas-stubs==3.0.3.260530",
    "types-openpyxl==3.1.5.20260518",
    "types-xlrd==2.0.0.20260518",
    # lxml-stubs: tipado de lxml para los parsers ATOM/CODICE (PLACSP)
    "lxml-stubs==0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gasto_estado"]

# ---------------------------------------------------------------------------
# Calidad de código
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.flake8-bugbear]
# Patrón idiomático de FastAPI: las dependencias/parámetros se declaran como
# valor por defecto (Depends/Query). No es el antipatrón mutable que B008 vigila.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
