# ---------------------------------------------------------------------------
# Catálogo de fuentes de datos — gasto-estado
#
# Cada fuente declara: nombre, descripción, URL base o patrón, formato,
# periodicidad y perímetro. Los patrones NO confirmados con una petición real
# están marcados con "TODO: verificar". No codificar parsers contra URLs
# sin verificar (ver CLAUDE.md §4).
# ---------------------------------------------------------------------------

igae_mensual:
  nombre: "IGAE — Ejecución del Presupuesto. AGE"
  descripcion: >
    Ejecución presupuestaria mensual de la Administración General del Estado.
    Anexo I = gasto por clasificación orgánica/programa/económica (pieza clave).
    Incluye también Cuadros, Anexo II, Extracto de ejecución y Avance comentado
    de pagos. Histórico desde 2003 (selector hasta 2001). Publicación ~25-30
    días tras cierre de mes. VERIFICADO 2026-06-11 con peticiones reales:
    el patrón de fichero resuelve para 2019+; en ≤2018 el nombre lleva a veces
    el sufijo " (EXCEL)" de forma inconsistente → para históricos antiguos,
    scrapear la página del año. Estructura del Anexo I documentada en
    docs/igae_anexo_i_estructura.md.
  url_base: "https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadPublica/CPE/EjecucionPresupuestaria/Paginas/EjecucionPresupuestaria.aspx"
  # Página navegable de la publicación AGE (año en curso); históricos en
  # imejecucionpresupuesto<YYYY>.aspx (verificado 2012-2025).
  url_index: "https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadPublica/CPE/EjecucionPresupuestaria/Paginas/imejecucionpresupuesto.aspx"
  # Directorio de documentos; el Anexo I es
  # "<url_documents>/MENSUAL%20<MES>%20<AÑO>%20ANEXO%20I.xlsx" con el mes en
  # mayúsculas en español (mismo directorio: Cuadros "MENSUAL <MES> <AÑO>.xlsx"
  # y "... ANEXO II.xlsx").
  url_documents: "https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadPublica/CPE/EjecucionPresupuestaria/Documents"
  formato: "XLSX (+ PDF)"
  periodicidad: "mensual"
  perimetro: "AGE"

igae_organismos:
  nombre: "IGAE — Ejecución del Presupuesto. Organismos"
  descripcion: >
    Ejecución presupuestaria de organismos autónomos (OOAA) y otros organismos
    estatales. Misma página índice que la serie AGE.
  url_base: "https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadPublica/CPE/EjecucionPresupuestaria/Paginas/EjecucionPresupuestaria.aspx"
  url_pattern: null  # TODO: verificar patrón de descarga de los ficheros
  formato: "XLSX (+ PDF)"
  periodicidad: "mensual"
  perimetro: "OOAA y otros organismos estatales"

igae_contabilidad_nacional:
  nombre: "IGAE — Contabilidad Nacional (CIGAE)"
  descripcion: >
    Déficit en términos de contabilidad nacional (SEC-2010). Serie SEPARADA de
    la contabilidad presupuestaria: nunca mezclar (ver CLAUDE.md §1 y §3).
  url_base: null  # TODO: verificar página índice y patrón de descarga
  formato: "XLSX (+ PDF)"
  periodicidad: "mensual"
  perimetro: "AGE / sector Administraciones Públicas"

igae_pmp:
  nombre: "IGAE — Informes PMP / Registro Contable de Facturas"
  descripcion: >
    Periodo medio de pago y plazos de pago por ministerio.
  url_base: null  # TODO: verificar página índice y patrón de descarga
  formato: "XLSX"
  periodicidad: "mensual"
  perimetro: "AGE"

pge:
  nombre: "PGE — Presupuestos Generales del Estado (créditos iniciales)"
  descripcion: >
    Créditos iniciales al máximo detalle, publicados por la SEPG y en
    datos.gob.es. En años de prórroga distinguir crédito inicial legal vs
    operativo. VERIFICADO 2026-06: el árbol PGE-ROM de la SEPG publica los
    estados de gastos por programa en CSV/XML (latin-1, separador ';');
    el dataset agregado de datos.gob.es solo enlaza páginas de aterrizaje.
  url_base: "https://www.sepg.pap.hacienda.gob.es/Presup/PGE2025Prorroga/MaestroDocumentos/PGE-ROM/Indice.htm"
  formato: "CSV (latin-1, ';') / XML / HTM"
  periodicidad: "anual (o prórroga)"
  perimetro: "AGE + organismos estatales"

pge_organica:
  nombre: "PGE — Clasificación orgánica (secciones y servicios presupuestarios)"
  descripcion: >
    Relación oficial de secciones y servicios presupuestarios del PGE vigente,
    del documento "Resumen general por servicios y capítulos del presupuesto
    de gastos" (Serie verde del PGE-ROM, SEPG). VERIFICADO 2026-06: en 2026
    rige la prórroga del PGE 2025 (etiqueta oficial "2025-P"); el árbol
    PGE2025Prorroga refleja la estructura ministerial vigente (37 secciones,
    22 ministerios). CSV en latin-1 con separador ';'. La URL cambia con cada
    ejercicio/prórroga: actualizarla al publicarse un nuevo PGE.
  url_base: "https://www.sepg.pap.hacienda.gob.es/Presup/PGE2025Prorroga/MaestroDocumentos/PGE-ROM/Indice.htm"
  url_resumen_servicios: "https://www.sepg.pap.hacienda.gob.es/Presup/PGE2025Prorroga/MaestroDocumentos/PGE-ROM/doc/CSV/N_25P_E_V_1_101_1_1_2_A_1.CSV"
  formato: "CSV (latin-1, ';')"
  periodicidad: "anual (o prórroga)"
  perimetro: "Estado (secciones 01-38); OOAA y resto de entidades aparte"
  ejercicio_vigente: 2026

placsp:
  nombre: "PLACSP — Plataforma de Contratación del Sector Público (datos abiertos)"
  descripcion: >
    Licitaciones y adjudicaciones en formato ATOM/XML CODICE. Tres datasets:
    perfiles propios, agregación CCAA y contratos menores. ZIP por año (desde
    2012) o por mes del año en curso. Paginación: seguir atom:link@rel="next";
    máx. 500 entradas por fichero. Sindicación 643 = licitaciones perfil PLACSP
    sin contratos menores.
  url_base: "https://contrataciondelsectorpublico.gob.es/wps/portal/DatosAbiertos"
  url_pattern: null  # TODO: verificar URLs de los ZIP anuales/mensuales
  formato: "ATOM/XML (CODICE), ZIP"
  periodicidad: "diaria"
  perimetro: "Sector público estatal (v1: filtrar AGE + organismos estatales)"

bdns:
  nombre: "BDNS / SNPSAP — Sistema Nacional de Publicidad de Subvenciones"
  descripcion: >
    Convocatorias y concesiones de subvenciones vía API REST de
    infosubvenciones.es, con órgano concedente a nivel de dirección general.
  url_base: "https://www.infosubvenciones.es"  # TODO: verificar endpoints de la API REST
  formato: "API REST (JSON)"
  periodicidad: "diaria"
  perimetro: "AGE + organismos estatales (v1)"

boe:
  nombre: "BOE — Sumario diario (API XML)"
  descripcion: >
    Sumario diario del BOE: modificaciones de crédito, reales decretos de
    concesión de créditos extraordinarios/suplementos, convocatorias.
  url_base: "https://www.boe.es"  # TODO: verificar endpoint del sumario XML
  formato: "XML"
  periodicidad: "diaria"
  perimetro: "AGE"

consejo_ministros:
  nombre: "Consejo de Ministros — Referencias (La Moncloa)"
  descripcion: >
    Acuerdos del Consejo de Ministros: autorizaciones de gasto, transferencias
    de crédito, convenios. HTML estructurado, publicado tras la reunión semanal
    (martes).
  url_base: "https://www.lamoncloa.gob.es"  # TODO: verificar URL de las referencias
  formato: "HTML"
  periodicidad: "semanal (martes)"
  perimetro: "AGE"

dir3:
  nombre: "DIR3 — Directorio Común de Unidades Orgánicas y Oficinas"
  descripcion: >
    Árbol orgánico ministerio → secretaría de Estado → dirección general con
    códigos únicos. Base del crosswalk servicio presupuestario ↔ DIR3.
    Dataset nacional en datos.gob.es (E05251701, publica el Ministerio de
    Hacienda). Los ficheros se sirven desde el Portal de Administración
    Electrónica (PAe). VERIFICADO 2026-06: formato real XLSX (no CSV); el host
    de descargas está tras un WAF BIG-IP que puede rechazar peticiones
    automatizadas (en ese caso, aportar el fichero a mano en data/raw/dir3/).
  url_base: "https://datos.gob.es/es/catalogo/e05251701-directorio-comun-de-unidades-organicas-y-oficinas-dir3"
  formato: "XLSX"
  periodicidad: "~mensual"
  perimetro: "AGE (unidades orgánicas estatales); EELL excluido en v1"
  # Distribuciones a descargar. La unidad AGE es el árbol orgánico (pieza clave);
  # los catálogos de tipos sirven para decodificar códigos. EELL queda fuera de v1.
  # "requerido: false" = si el WAF bloquea la descarga se avisa y se continúa
  # (son catálogos decodificadores; el parser no los necesita).
  files:
    - key: "unidades_age"
      filename: "Listado Unidades AGE.xlsx"
      url: "https://administracionelectronica.gob.es/ctt/resources/Soluciones/238/Descargas/Listado%20Unidades%20AGE.xlsx?idIniciativa=238&idElemento=2741"
      descripcion: "Árbol orgánico de la AGE (pieza clave)."
      requerido: true
    - key: "tipos_unidad_organica"
      filename: "Catalogo de Tipos de Unidad Organica.xlsx"
      url: "https://administracionelectronica.gob.es/ctt/resources/Soluciones/238/Descargas/Catalogo%20de%20Tipos%20de%20Unidad%20Organica.xlsx?idIniciativa=238&idElemento=424"
      descripcion: "Catálogo de tipos de unidad orgánica (decodifica el tipo)."
      requerido: false
    - key: "tipos_entidad_publica"
      filename: "Catalogo de Tipos de Entidad Publica.xlsx"
      url: "https://administracionelectronica.gob.es/ctt/resources/Soluciones/238/Descargas/Catalogo%20de%20Tipos%20de%20Entidad%20Publica.xlsx?idIniciativa=238&idElemento=423"
      descripcion: "Catálogo de tipos de entidad pública (decodifica la entidad)."
      requerido: false

invente:
  nombre: "INVENTE — Inventario de Entes del Sector Público estatal"
  descripcion: >
    Perímetro de entidades del sector público estatal. Define qué organismos
    entran en el alcance del proyecto.
  url_base: null  # TODO: verificar página de descarga (IGAE/Hacienda)
  formato: null  # TODO: verificar formato de publicación
  periodicidad: "continua"
  perimetro: "Sector público estatal"
