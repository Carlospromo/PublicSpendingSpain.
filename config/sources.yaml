# ---------------------------------------------------------------------------
# Catálogo de fuentes de datos — gasto-estado
#
# Cada fuente declara: nombre, descripción, URL base o patrón, formato,
# periodicidad y perímetro. Los patrones NO confirmados con una petición real
# están marcados con "TODO: verificar". No codificar parsers contra URLs
# sin verificar (ver CLAUDE.md §4).
# ---------------------------------------------------------------------------

igae_mensual:
  nombre: "IGAE — Ejecución del Presupuesto. AGE"
  descripcion: >
    Ejecución presupuestaria mensual de la Administración General del Estado.
    Anexo I = gasto por clasificación orgánica/programa/económica (pieza clave).
    Incluye también Cuadros, Anexo II, Extracto de ejecución y Avance comentado
    de pagos. Histórico desde 2003 (selector hasta 2001). Publicación ~25-30
    días tras cierre de mes. VERIFICADO 2026-06-11 con peticiones reales:
    el patrón de fichero resuelve para 2019+; en ≤2018 el nombre lleva a veces
    el sufijo " (EXCEL)" de forma inconsistente → para históricos antiguos,
    scrapear la página del año. Contenedor: BIFF .xls de 2015 a ~abril 2016
    (2015 solo publica el cierre de diciembre en Excel); OOXML .xlsx desde
    ~noviembre 2016. Estructura y vintages documentados en
    docs/igae_anexo_i_estructura.md.
  url_base: "https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadPublica/CPE/EjecucionPresupuestaria/Paginas/EjecucionPresupuestaria.aspx"
  # Página navegable de la publicación AGE (año en curso); históricos en
  # imejecucionpresupuesto<YYYY>.aspx (verificado 2012-2025).
  url_index: "https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadPublica/CPE/EjecucionPresupuestaria/Paginas/imejecucionpresupuesto.aspx"
  # Directorio de documentos; el Anexo I es
  # "<url_documents>/MENSUAL%20<MES>%20<AÑO>%20ANEXO%20I.xlsx" con el mes en
  # mayúsculas en español (mismo directorio: Cuadros "MENSUAL <MES> <AÑO>.xlsx"
  # y "... ANEXO II.xlsx").
  url_documents: "https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadPublica/CPE/EjecucionPresupuestaria/Documents"
  formato: "XLSX (+ PDF)"
  periodicidad: "mensual"
  perimetro: "AGE"

igae_organismos:
  nombre: "IGAE — Ejecución del Presupuesto. Organismos"
  descripcion: >
    Ejecución presupuestaria de organismos autónomos (OOAA) y otros organismos
    estatales. Misma página índice que la serie AGE.
  url_base: "https://www.igae.pap.hacienda.gob.es/sitios/igae/es-ES/Contabilidad/ContabilidadPublica/CPE/EjecucionPresupuestaria/Paginas/EjecucionPresupuestaria.aspx"
  url_pattern: null  # TODO: verificar patrón de descarga de los ficheros
  formato: "XLSX (+ PDF)"
  periodicidad: "mensual"
  perimetro: "OOAA y otros organismos estatales"

igae_contabilidad_nacional:
  nombre: "IGAE — Contabilidad Nacional (CIGAE)"
  descripcion: >
    Déficit en términos de contabilidad nacional (SEC-2010). Serie SEPARADA de
    la contabilidad presupuestaria: nunca mezclar (ver CLAUDE.md §1 y §3).
  url_base: null  # TODO: verificar página índice y patrón de descarga
  formato: "XLSX (+ PDF)"
  periodicidad: "mensual"
  perimetro: "AGE / sector Administraciones Públicas"

igae_pmp:
  nombre: "IGAE — Informes PMP / Registro Contable de Facturas"
  descripcion: >
    Periodo medio de pago y plazos de pago por ministerio.
  url_base: null  # TODO: verificar página índice y patrón de descarga
  formato: "XLSX"
  periodicidad: "mensual"
  perimetro: "AGE"

pge:
  nombre: "PGE — Presupuestos Generales del Estado (créditos iniciales)"
  descripcion: >
    Créditos iniciales al máximo detalle, publicados por la SEPG y en
    datos.gob.es. En años de prórroga distinguir crédito inicial legal vs
    operativo. VERIFICADO 2026-06: el árbol PGE-ROM de la SEPG publica los
    estados de gastos por programa en CSV/XML (latin-1, separador ';');
    el dataset agregado de datos.gob.es solo enlaza páginas de aterrizaje.
  url_base: "https://www.sepg.pap.hacienda.gob.es/Presup/PGE2025Prorroga/MaestroDocumentos/PGE-ROM/Indice.htm"
  formato: "CSV (latin-1, ';') / XML / HTM"
  periodicidad: "anual (o prórroga)"
  perimetro: "AGE + organismos estatales"

pge_organica:
  nombre: "PGE — Clasificación orgánica (secciones y servicios presupuestarios)"
  descripcion: >
    Relación oficial de secciones y servicios presupuestarios del PGE vigente,
    del documento "Resumen general por servicios y capítulos del presupuesto
    de gastos" (Serie verde del PGE-ROM, SEPG). VERIFICADO 2026-06: en 2026
    rige la prórroga del PGE 2025 (etiqueta oficial "2025-P"); el árbol
    PGE2025Prorroga refleja la estructura ministerial vigente (37 secciones,
    22 ministerios). CSV en latin-1 con separador ';'. La URL cambia con cada
    ejercicio/prórroga: actualizarla al publicarse un nuevo PGE.
  url_base: "https://www.sepg.pap.hacienda.gob.es/Presup/PGE2025Prorroga/MaestroDocumentos/PGE-ROM/Indice.htm"
  url_resumen_servicios: "https://www.sepg.pap.hacienda.gob.es/Presup/PGE2025Prorroga/MaestroDocumentos/PGE-ROM/doc/CSV/N_25P_E_V_1_101_1_1_2_A_1.CSV"
  formato: "CSV (latin-1, ';')"
  periodicidad: "anual (o prórroga)"
  perimetro: "Estado (secciones 01-38); OOAA y resto de entidades aparte"
  ejercicio_vigente: 2026

placsp:
  nombre: "PLACSP — Plataforma de Contratación del Sector Público (datos abiertos)"
  descripcion: >
    Licitaciones y adjudicaciones en formato ATOM/XML CODICE (espacios de nombres
    urn:dgpe:names:draft:codice…-2). Tres datasets; en v1 SOLO la sindicación 643
    (licitaciones de los perfiles del contratante, SIN contratos menores), que es
    la que ancla a la espina orgánica vía DIR3. La agregación de plataformas
    autonómicas (sindicación 1044) queda fuera de perímetro v1 (CCAA) y los
    contratos menores son un dataset de grano distinto: ambos se añadirán con su
    propio fixture y tests. VERIFICADO 2026-06-12 con descargas reales:
    el ZIP por año resuelve para 2012-2026 (incluido el año en curso); el feed
    ATOM "cabecera" pagina hacia atrás con atom:link@rel="next" (cada fichero
    trae como máx. 500 entradas; cabecera real observada: 338). El nombrado
    mensual (…_YYYYMM.zip) resuelve pero devuelve un payload de >150 MB no
    acotado al mes, así que NO se usa: el año en curso se cubre con el ZIP anual.
    Estructura y modelo canónico documentados en docs/placsp_estructura.md.
    NOTA raw: a diferencia de IGAE (ficheros < 1,5 MB), una captura PLACSP pesa
    10-160 MB; el raw masivo se regenera con el extractor / git-scraping de CI y
    NO se versiona (ver .gitignore). La muestra real reducida vive en
    tests/fixtures/placsp_643_page*.atom.
  url_base: "https://contrataciondelsectorpublico.gob.es/wps/portal/DatosAbiertos"
  # Sindicación 643 (perfiles del contratante, completo sin menores).
  # Feed cabecera (último tramo, actualización diaria) + paginación rel="next":
  url_atom_cabecera: "https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom"
  # ZIP por año (histórico desde 2012 y año en curso); <YYYY> interpolado:
  url_zip_anual_patron: "https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_{anio}.zip"
  anio_minimo: 2012
  formato: "ATOM/XML (CODICE 2.x), ZIP"
  periodicidad: "diaria"
  perimetro: "Sector público estatal (v1: anclar AGE + organismos estatales; resto etiquetado y contabilizado, no descartado)"

bdns:
  nombre: "BDNS / SNPSAP — Sistema Nacional de Publicidad de Subvenciones"
  descripcion: >
    Concesiones (y convocatorias) de subvenciones vía la API REST pública del
    SNPSAP (infosubvenciones.es). VERIFICADO 2026-06-12 con llamadas reales:
    acceso público sin clave; paginación estilo Spring (page/pageSize, hasta
    pageSize=10000 honrado; la respuesta trae totalElements/totalPages/last);
    filtro incremental por fechaDesde/fechaHasta (DD/MM/AAAA, inclusivo, sobre
    la fecha de concesión) y por ámbito tipoAdministracion (C=Estado,
    A=autonómica, L=local). IMPORTANTE: la API NO publica el código DIR3 del
    órgano concedente — solo la jerarquía administrativa como texto
    (nivel1/nivel2/nivel3) y, en convocatorias, un codigoInvente (INVENTE).
    El anclaje orgánico resuelve nivel3 → DIR3 por denominación normalizada
    (docs/bdns_estructura.md). El NIF de personas físicas llega enmascarado de
    origen (***dddd**); las jurídicas, en claro. El aviso legal advierte de
    posibles medidas restrictivas ante abuso del API: el extractor pagina con
    reintentos/backoff y una pausa cortés entre páginas. Volumen: ~26,8 M de
    concesiones totales, ~17 M estatales (dominadas por microayudas ICO/Red.es):
    el raw NO se versiona (ver .gitignore), se regenera por ventana de fechas.
  url_base: "https://www.infosubvenciones.es"
  url_api_base: "https://www.infosubvenciones.es/bdnstrans/api"
  endpoint_concesiones: "concesiones/busqueda"
  page_size: 5000
  formato: "API REST (JSON)"
  periodicidad: "diaria"
  perimetro: "AGE + organismos estatales (v1: ámbito C por defecto; resto etiquetado fuera_perimetro, no descartado)"

boe:
  nombre: "BOE — Sumario diario (API XML)"
  descripcion: >
    Sumario diario del BOE como señal de "decisiones políticas" (CLAUDE.md §3):
    convocatorias de subvenciones (extractos SNPS, con identificador BDNS),
    concesiones directas de subvención por Real Decreto, y modificaciones
    presupuestarias con título explícito (créditos extraordinarios, suplementos,
    transferencias de crédito). VERIFICADO 2026-06-12 con llamadas reales:
    el sumario se obtiene de la API de datos abiertos
    GET {url_api}/boe/sumario/<AAAAMMDD> (XML; envelope response>data>sumario>
    diario>seccion>departamento>[epigrafe]>item). Cada item trae identificador
    (BOE-A/B-AAAA-N), título, departamento (ministerio proponente) y url_xml de
    la disposición. La disposición individual (GET {url_xml_disposicion}?id=<ID>)
    añade analisis>tipo (clasificación oficial; tipo 63 = "Subvenciones (SNPS)",
    a veces vacío), el texto en <texto><p> y, en subvenciones, el
    "BDNS(Identif.):" como primer párrafo. Los importes aparecen en el texto en
    formato español ("1.000.000,00 €", "8.000 euros"); los expresados en letra
    no se extraen (se marca la confianza). LIMITACIÓN VERIFICADA: las
    modificaciones de crédito embebidas en Reales Decretos-leyes de medidas
    amplias (p. ej. RDL 6/2024 de la DANA) NO se nombran en el título y no se
    detectan por título — son señal, no contabilidad (docs/boe_estructura.md).
    Estructura y vintages documentados ahí. NOTA raw: los sumarios son pequeños
    (<300 KB) → SÍ se versionan (git-scraping).
  url_base: "https://www.boe.es"
  url_api: "https://www.boe.es/datosabiertos/api"
  url_sumario_patron: "https://www.boe.es/datosabiertos/api/boe/sumario/{fecha}"  # fecha = AAAAMMDD
  url_xml_disposicion: "https://www.boe.es/diario_boe/xml.php"  # ?id=<BOE-A-AAAA-N>
  formato: "XML (datos abiertos)"
  periodicidad: "diaria"
  perimetro: "AGE (anclaje a sección por departamento proponente)"

consejo_ministros:
  nombre: "Consejo de Ministros — Referencias (La Moncloa)"
  descripcion: >
    Referencia (acta-resumen) del Consejo de Ministros como señal de "decisiones
    políticas" (CLAUDE.md §3): autorizaciones de gasto, suplementos/transferencias
    de crédito, subvenciones, convenios y nombramientos. HTML estructurado,
    publicado tras la reunión semanal (normalmente martes). VERIFICADO 2026-06-12
    con descargas reales: la referencia vive en {url_referencia_patron} (vintage
    actual, 2024+) o en el patrón antiguo refc<AAAAMMDD>.aspx (2018-~2021).
    Estructura estable entre vintages: bloque <h2>SUMARIO</h2> con <h3> =
    ministerio proponente y <li>/<div> = un acuerdo cada uno (texto que empieza
    por ACUERDO/REAL DECRETO/CONVENIO/…), con el importe embebido ("por importe
    total de 168.000.000 de euros"). El nombre del ministerio en el h3 va SIN el
    prefijo "Ministerio de" (p. ej. "Hacienda", "Para la Transición Ecológica y
    el Reto Demográfico"): el anclaje a sección normaliza y resuelve esa forma
    corta. Vintages y maquetación en docs/consejo_ministros_estructura.md.
    NOTA raw: el HTML es <300 KB → SÍ se versiona.
  url_base: "https://www.lamoncloa.gob.es"
  url_index: "https://www.lamoncloa.gob.es/consejodeministros/referencias/Paginas/index.aspx"
  # Vintage actual (2024+): <AAAAMMDD>-referencia-rueda-de-prensa-ministros.aspx.
  url_referencia_patron: "https://www.lamoncloa.gob.es/consejodeministros/referencias/Paginas/{anio}/{fecha}-referencia-rueda-de-prensa-ministros.aspx"
  # Vintage antiguo (2018-~2021): refc<AAAAMMDD>.aspx (mismo árbol por año).
  url_referencia_patron_legacy: "https://www.lamoncloa.gob.es/consejodeministros/referencias/Paginas/{anio}/refc{fecha}.aspx"
  formato: "HTML"
  periodicidad: "semanal (martes)"
  perimetro: "AGE (anclaje a sección por ministerio proponente)"

dir3:
  nombre: "DIR3 — Directorio Común de Unidades Orgánicas y Oficinas"
  descripcion: >
    Árbol orgánico ministerio → secretaría de Estado → dirección general con
    códigos únicos. Base del crosswalk servicio presupuestario ↔ DIR3.
    Dataset nacional en datos.gob.es (E05251701, publica el Ministerio de
    Hacienda). Los ficheros se sirven desde el Portal de Administración
    Electrónica (PAe). VERIFICADO 2026-06: formato real XLSX (no CSV); el host
    de descargas está tras un WAF BIG-IP que puede rechazar peticiones
    automatizadas (en ese caso, aportar el fichero a mano en data/raw/dir3/).
  url_base: "https://datos.gob.es/es/catalogo/e05251701-directorio-comun-de-unidades-organicas-y-oficinas-dir3"
  formato: "XLSX"
  periodicidad: "~mensual"
  perimetro: "AGE (unidades orgánicas estatales); EELL excluido en v1"
  # Distribuciones a descargar. La unidad AGE es el árbol orgánico (pieza clave);
  # los catálogos de tipos sirven para decodificar códigos. EELL queda fuera de v1.
  # "requerido: false" = si el WAF bloquea la descarga se avisa y se continúa
  # (son catálogos decodificadores; el parser no los necesita).
  files:
    - key: "unidades_age"
      filename: "Listado Unidades AGE.xlsx"
      url: "https://administracionelectronica.gob.es/ctt/resources/Soluciones/238/Descargas/Listado%20Unidades%20AGE.xlsx?idIniciativa=238&idElemento=2741"
      descripcion: "Árbol orgánico de la AGE (pieza clave)."
      requerido: true
    - key: "tipos_unidad_organica"
      filename: "Catalogo de Tipos de Unidad Organica.xlsx"
      url: "https://administracionelectronica.gob.es/ctt/resources/Soluciones/238/Descargas/Catalogo%20de%20Tipos%20de%20Unidad%20Organica.xlsx?idIniciativa=238&idElemento=424"
      descripcion: "Catálogo de tipos de unidad orgánica (decodifica el tipo)."
      requerido: false
    - key: "tipos_entidad_publica"
      filename: "Catalogo de Tipos de Entidad Publica.xlsx"
      url: "https://administracionelectronica.gob.es/ctt/resources/Soluciones/238/Descargas/Catalogo%20de%20Tipos%20de%20Entidad%20Publica.xlsx?idIniciativa=238&idElemento=423"
      descripcion: "Catálogo de tipos de entidad pública (decodifica la entidad)."
      requerido: false

invente:
  nombre: "INVENTE — Inventario de Entes del Sector Público estatal"
  descripcion: >
    Perímetro de entidades del sector público estatal. Define qué organismos
    entran en el alcance del proyecto.
  url_base: null  # TODO: verificar página de descarga (IGAE/Hacienda)
  formato: null  # TODO: verificar formato de publicación
  periodicidad: "continua"
  perimetro: "Sector público estatal"
